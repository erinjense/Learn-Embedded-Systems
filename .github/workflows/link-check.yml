name: Check links

on:
  schedule:
    - cron: "0 6 1 * *"   # first day of every month
  workflow_dispatch:
  pull_request:
    paths: ["docs/**", "README.md"]

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python tools/check_links.py --fail-on-dead
